    <!DOCTYPE html>
    <html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
</head>
<style>
    body {
        background-image: url(images/cator.jfif);
        background-position: center;
        background-size: cover;
        font-family: Arial, sans-serif;
    }
    #style {
        padding-top: 100px;
        padding-left: 400px;
    }

    .calculator {
        background-color: skyblue;
        background-position: center;
        background-size: cover;
        width: 400px;
        margin: 50px auto;
        padding-right: 100px;
        padding-left: 100px;
        padding-bottom: 30px;
        padding-top: 30px;
        border: 16px solid #1d0e0e;
        border-radius: 50px;
    }

    button {
        background-color: rgba(5, 98, 53, 0.329);
        color: rgb(138, 6, 6);
        font-weight: bolder;
        border: none;
        cursor: pointer;
    }

    #olivia {
        width: 100%;
        height: 40px;
        margin-bottom: 10px;
        color: black;
        text-align: left;
        font-size: 18px;
    }

    .buttons button {
        width: 90px;
        height: 40px;
        margin: 20px;
        font-size: 25px;
        border-radius: 5px;
    }
    
</style>

<body>


    <div class="style">
        <div class="calculator" >
            <input type="text" id="olivia" disabled>
            <div class="buttons">
                <button onclick="clearDisplay()">Clear</button>
                <button onclick="appendToDisplay('1')">1</button>
                <button onclick="appendToDisplay('2')">2</button>
                <button onclick="appendToDisplay('3')">3</button>
                <button onclick="appendToDisplay('4')">4</button>
                <button onclick="appendToDisplay('5')">5</button>
                <button onclick="appendToDisplay('6')">6</button>
                <button onclick="appendToDisplay('7')">7</button>
                <button onclick="appendToDisplay('8')">8</button>
                <button onclick="appendToDisplay('9')">9</button>
                <button onclick="appendToDisplay('0')">0</button>
                <button onclick="appendToDisplay('*')">*</button>
                <button onclick="appendToDisplay('/')">/</button>
                <button onclick="appendToDisplay('+')">+</button>
                <button onclick="appendToDisplay('-')">-</button>
                <button onclick="appendToDisplay('%')">%</button>
                <button onclick="appendToDisplay('.')">.</button>
                <button onclick="calculate()">=</button>
            </div>
        </div>
    </div>
    <script>
        const display = document.getElementById('olivia');

        // Adds numbers or operators to the screen
        function appendToDisplay(input) {
            display.value += input;
        }

        // Clears the screen
        function clearDisplay() {
            display.value = "";
        }

        // The "Magic" function
        function calculate() {
            try {

                display.value = eval(display.value);
            } catch (error) {
                display.value = "Error";
            }
        }
    </script>
</body>

</html>
