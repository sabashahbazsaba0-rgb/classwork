<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Image Gallery Slider</title>

<!-- jQuery CDN -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<style>
body {
    font-family: Arial;
    background: #1b4e7d;
    color: white;
    text-align: center;
}

/* Main container */
.gallery {
    width: 500px;
    margin: 50px auto;
}

/* Main Image */
.main-img img {
    width: 100%;
    height: 400px;
    border-radius: 10px;
}

/* Buttons */
.buttons {
    margin: 15px 0;
}

button {
    padding: 10px 20px;
    border: none;
    background: crimson;
    color: white;
    cursor: pointer;
    border-radius: 5px;
    margin: 5px;
}

button:hover {
    background: darkred;
}

/* Thumbnails */
.thumbnails {
    display: flex;
    justify-content: center;
    gap: 10px;
}

.thumbnails img {
    width: 100px;
    height: 150px;
    cursor: pointer;
    opacity: 0.6;
    border-radius: 5px;
}

/* Active thumbnail */
.active {
    border: 3px solid yellow;
    opacity: 1;
}
</style>
</head>

<body>

<h1>Image Gallery Slider</h1>

<div class="gallery">

    <!-- Main Image -->
    <div class="main-img">
        <img id="current" src="images/pf1.jpg">
    </div>

    <!-- Buttons -->
    <div class="buttons">
        <button id="prev">Previous</button>
        <button id="next">Next</button>
    </div>

    <!-- Thumbnails -->
    <div class="thumbnails">
        <img src="images/pf2.jpg" class="thumb active">
        <img src="images/pf5.jpg" class="thumb">
        <img src="images/pf4.jpg" class="thumb">
        <img src="images/pf6.jpg" class="thumb">
    </div>

</div>

<script>
$(document).ready(function(){

    let images = ["images/pf2.jpg", "images/pf5.jpg", "images/pf4.jpg", "images/pf6.jpg"];
    let index = 0;

    // Thumbnail Click
    $(".thumb").click(function(){
        let src = $(this).attr("src");
        
        $("#current").fadeOut(100, function(){
            $(this).attr("src", src).fadeIn(100);
        });

        $(".thumb").removeClass("active");
        $(this).addClass("active");

        index = images.indexOf(src);
    });

    // Next Button
    $("#next").click(function(){
        index++;
        if(index >= images.length) index = 0;

        changeImage();
    });

    // Previous Button
    $("#prev").click(function(){
        index--;
        if(index < 0) index = images.length - 1;

        changeImage();
    });

    // Change Image Function
    function changeImage(){
        $("#current").fadeOut(100, function(){
            $(this).attr("src", images[index]).fadeIn(100);
        });

        $(".thumb").removeClass("active");
        $(".thumb").eq(index).addClass("active");
    }

    // Auto Slide
    setInterval(function(){
        $("#next").click();
    }, 3000);

});
</script>

</body>
</html>
