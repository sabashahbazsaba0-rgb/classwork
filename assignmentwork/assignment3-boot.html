<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Advanced Dashboard</title>

<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Bootstrap Icons -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body class="bg-light">

<!-- ✅ NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3">
    <a class="navbar-brand" href="#">Admin Panel</a>

    <!-- Search -->
    <form class="d-none d-md-flex ms-auto me-3">
        <input class="form-control form-control-sm" type="search" placeholder="Search">
    </form>

    <!-- Profile -->
    <div class="dropdown">
        <button class="btn btn-dark dropdown-toggle" data-bs-toggle="dropdown">
            <i class="bi bi-person-circle"></i> Admin
        </button>
        <ul class="dropdown-menu dropdown-menu-end">
            <li><a class="dropdown-item" href="#">Profile</a></li>
            <li><a class="dropdown-item" href="#">Settings</a></li>
            <li><hr class="dropdown-divider"></li>
            <li><a class="dropdown-item" href="#">Logout</a></li>
        </ul>
    </div>
</nav>

<div class="container-fluid">
<div class="row">

<!-- ✅ SIDEBAR -->
<div class="col-lg-2 col-md-3 bg-white border-end min-vh-100 p-3">
    <h6 class="text-muted">MENU</h6>

    <ul class="nav flex-column">
        <li class="nav-item">
            <a class="nav-link active" href="#"><i class="bi bi-speedometer2"></i> Dashboard</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="#"><i class="bi bi-people"></i> Users</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="#"><i class="bi bi-box"></i> Products</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="#"><i class="bi bi-cart"></i> Orders</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="#"><i class="bi bi-gear"></i> Settings</a>
        </li>
    </ul>
</div>

<!-- ✅ MAIN -->
<div class="col-lg-10 col-md-9 p-4">

    <!-- ✅ CARDS -->
    <div class="row g-4 mb-4">

        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-body d-flex justify-content-between">
                    <div>
                        <h6>Total Users</h6>
                        <h4>120</h4>
                    </div>
                    <i class="bi bi-people fs-1 text-primary"></i>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-body d-flex justify-content-between">
                    <div>
                        <h6>Orders</h6>
                        <h4>75</h4>
                    </div>
                    <i class="bi bi-cart fs-1 text-success"></i>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-body d-flex justify-content-between">
                    <div>
                        <h6>Revenue</h6>
                        <h4>$5000</h4>
                    </div>
                    <i class="bi bi-currency-dollar fs-1 text-warning"></i>
                </div>
            </div>
        </div>

    </div>

    <!-- ✅ HEADER -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h5>Users Management</h5>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#userModal">
            <i class="bi bi-plus"></i> Add User
        </button>
    </div>

    <!-- ✅ TABLE -->
    <div class="table-responsive">
        <table class="table table-striped table-bordered align-middle">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>1</td>
                    <td>Ali</td>
                    <td>ali@mail.com</td>
                    <td><span class="badge bg-success">Active</span></td>
                </tr>
                <tr>
                    <td>2</td>
                    <td>Sara</td>
                    <td>sara@mail.com</td>
                    <td><span class="badge bg-danger">Inactive</span></td>
                </tr>
            </tbody>
        </table>
    </div>

</div>
</div>
</div>

<!-- ✅ MODAL -->
<div class="modal fade" id="userModal">
    <div class="modal-dialog">
        <div class="modal-content">

            <div class="modal-header">
                <h5>Add New User</h5>
                <button class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">
                <form>
                    <input class="form-control mb-3" placeholder="Name">
                    <input class="form-control mb-3" type="email" placeholder="Email">
                    <input class="form-control mb-3" type="password" placeholder="Password">
                    <button class="btn btn-success w-100">Submit</button>
                </form>
            </div>

        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
