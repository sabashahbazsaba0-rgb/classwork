<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Modern Cafe</title>
<link rel="stylesheet" href="style.css">

<!-- Icons -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
</head>

<body>

<!-- NAVBAR -->
<header id="navbar">
  <h2>☕ Cafe</h2>
  <nav>
    <a href="#">Home</a>
    <a href="#menu">Menu</a>
    <a href="#gallery">Gallery</a>
    <a href="#contact">Contact</a>
  </nav>
</header>

<!-- HERO SLIDER -->
<section class="hero">
  <div class="slider">
    <div class="slide active" style="background-image:url('https://source.unsplash.com/1600x900/?coffee')"></div>
    <div class="slide" style="background-image:url('https://source.unsplash.com/1600x900/?cafe')"></div>
    <div class="slide" style="background-image:url('https://source.unsplash.com/1600x900/?dessert')"></div>
  </div>

  <div class="hero-text">
    <h1>Welcome to Modern Cafe</h1>
    <p>Best taste | Best vibes ☕</p>
    <button onclick="openLogin()">Get Started</button>
  </div>
</section>

<!-- MENU -->
<section id="menu" class="menu">
  <h2>Our Menu</h2>
  <div class="menu-items">

    <div class="item">
      <i class="fa fa-coffee"></i>
      <h3>Cappuccino</h3>
      <p>$5</p>
    </div>

    <div class="item">
      <i class="fa fa-burger"></i>
      <h3>Burger</h3>
      <p>$8</p>
    </div>

    <div class="item">
      <i class="fa fa-ice-cream"></i>
      <h3>Ice Cream</h3>
      <p>$4</p>
    </div>

  </div>
</section>

<!-- GALLERY -->
<section id="gallery" class="gallery">
  <h2>Gallery</h2>
  <div class="images">
    <img src="https://source.unsplash.com/300x200/?coffee">
    <img src="https://source.unsplash.com/300x200/?restaurant">
    <img src="https://source.unsplash.com/300x200/?food">
    <img src="https://source.unsplash.com/300x200/?cafe-interior">
  </div>
</section>

<!-- CONTACT -->
<section id="contact" class="contact">
  <h2>Contact Us</h2>

  <form id="form">
    <input type="text" placeholder="Name" required>
    <input type="email" placeholder="Email" required>
    <textarea placeholder="Message"></textarea>
    <button>Send</button>
  </form>

  <iframe src="https://maps.google.com/maps?q=Narowal&t=&z=13&ie=UTF8&iwloc=&output=embed"></iframe>
</section>

<!-- LOGIN / SIGNUP -->
<div class="auth-box" id="authBox">
  <div class="auth">
    <h2>Login</h2>
    <input type="text" placeholder="Username">
    <input type="password" placeholder="Password">
    <button onclick="closeLogin()">Login</button>
    <p>Don't have account? <span onclick="toggleAuth()">Signup</span></p>
  </div>
</div>

<button class="login-btn" onclick="openLogin()">Login</button>

<script src="script.js"></script>
</body>
</html>
