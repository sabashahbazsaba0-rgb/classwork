<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        //arrays-->
        let marks = [20, 40, 50, 60];
        marks[0] = 100;
        document.writeln(marks + "<br>");
        document.writeln(marks.length + "<br>");//property(give some value)
        //push-->(add last)
        let saba = [20, 40, 50, 60];
        saba.push(55);
        document.writeln(saba + "<br>")
        document.writeln(saba.length + "<br>");
        //pop-->(remove from last)
        let Friends = ["saba", "sadi", "sana", "olivia"];
        Friends.pop()
        document.writeln(Friends + "<br>");
        //unshift(add start)
        let Fruits = ["mango", "apple", "banana", "orange"];
        Fruits.unshift("kiwi");
        document.writeln(Fruits + "<br>");
        //shift(remove from first)
        let ages = [17, 20, 22, 24, 28];
        ages.shift();
        document.writeln(ages + "<br>");
        //use for loop//
        let sibling = ["saba", "sadi", "sana", "olivia"];

        for (let i = 0; i < sibling.length; i++) {
            document.writeln(sibling[i]);
        }
        //for of//
        let cities = ["lahore", "narowal", "silkote", "qila"];
        for (let city of cities) {

            document.writeln(city.toUpperCase(), "<br>");
        }





        //array to sting-->
        let vegetables = ["potato", "chicken", "carrot"];
        vegetables




        //looping at a arrays()


    </script>
</body>

</html>
