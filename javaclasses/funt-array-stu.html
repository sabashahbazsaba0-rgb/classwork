<!DOCTYPE html>
<html>

<head>
    <title>Students Array</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: #f5f5f5;
        }

        h1 {
            color: #333;
        }

        button {
            padding: 10px;
            margin: 5px;
            background: green;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: darkgreen;
        }

        #output {
            margin-top: 20px;
        }

        .box {
            background: white;
            width: 200px;
            margin: 5px auto;
            padding: 10px;
            border-radius: 5px;
            box-shadow: 0 0 5px gray;
        }
    </style>
</head>

<body>
    <h2>JavaScript Functions </h2>
    Enter First Number:
    <input type="number" id="num1"><br><br>
    Enter Second Number:
    <input type="number" id="num2"><br><br>
    <button onclick="add()">Add</button>
    <button onclick="subtract()">Subtract</button>
    <button onclick="multiply()">Multiply</button>
    <button onclick="divide()">Divide</button><br><br>
    <button onclick="numbers()">Print 1 to 10</button>
    <button onclick="evenNumbers()">Even Numbers</button>
    <button onclick="oddNumbers()">Odd Numbers</button>
    <button onclick="reverseNumbers()">Reverse Numbers</button>
    <button onclick="table()">Table of 5</button><br><br>
    <button onclick="sumNumbers()">Sum 1 to 10</button>
    <button onclick="square()">Square Numbers</button>
    <button onclick="checkEvenOdd()">Check Even Odd</button>
    <button onclick="grade()">Check Grade</button>
    <button onclick="message()">Show Message</button>
    <p id="result"></p>
    <script>
        function add() {
            let a = Number(document.getElementById("num1").value);
            let b = Number(document.getElementById("num2").value);
            let result = a + b;
            document.getElementById("result").innerHTML = "Result = " + result;
        }
        function subtract() {
            let a = Number(document.getElementById("num1").value);
            let b = Number(document.getElementById("num2").value);
            let result = a - b;
            document.getElementById("result").innerHTML = "Result = " + result;
        }
        function multiply() {
            let a = Number(document.getElementById("num1").value);
            let b = Number(document.getElementById("num2").value);
            let result = a * b;
            document.getElementById("result").innerHTML = "Result = " + result;
        }
        function divide() {
            let a = Number(document.getElementById("num1").value);
            let b = Number(document.getElementById("num2").value);
            let result = a / b;
            document.getElementById("result").innerHTML = "Result = " + result;
        }
        function numbers() {
            let text = "";
            for (let i = 1; i <= 10; i++) {
                text += i + "<br>";
            }
            document.getElementById("result").innerHTML = text;
        }
        function evenNumbers() {
            let text = "";
            for (let i = 1; i <= 20; i++) {
                if (i % 2 == 0) {
                    text += i + "<br>";
                }
            }
            document.getElementById("result").innerHTML = text;
        }
        function oddNumbers() {
            let text = "";
            for (let i = 1; i <= 20; i++) {
                if (i % 2 != 0) {
                    text += i + "<br>";
                }
            }
            document.getElementById("result").innerHTML = text;
        }
        function reverseNumbers() {
            let text = "";
            for (let i = 10; i >= 1; i--) {
                text += i + "<br>";
            }
            document.getElementById("result").innerHTML = text;
        }
        function table() {
            let text = "";
            for (let i = 1; i <= 10; i++) {
                text += "5 x " + i + " = " + (5 * i) + "<br>";
            }
            document.getElementById("result").innerHTML = text;
        }
        function sumNumbers() {
            let sum = 0;
            for (let i = 1; i <= 10; i++) {
                sum += i;
            }
            document.getElementById("result").innerHTML = "Sum = " + sum;
        }
        function square() {
            let text = "";
            for (let i = 1; i <= 10; i++) {
                text += (i * i) + "<br>";
            }
            document.getElementById("result").innerHTML = text;
        }
        function checkEvenOdd() {
            let num = 7;
            if (num % 2 == 0) {
                document.getElementById("result").innerHTML = "Number is Even";
            } else {
                document.getElementById("result").innerHTML = "Number is Odd";
            }
        }
        function grade() {
            let marks = 80;
            if (marks >= 80) {
                document.getElementById("result").innerHTML = "Grade A";
            }
            else if (marks >= 60) {
                document.getElementById("result").innerHTML = "Grade B";
            }
            else {
                document.getElementById("result").innerHTML = "Grade C";
            }
        }
        function message() {
            document.getElementById("result").innerHTML = "Welcome to JavaScript Functions";
        }
    </script>
    <h1>Students Names</h1>
    <button onclick="showStudents()">Show Students</button>
    <button onclick="addStudent()">Add Student</button>
    <button onclick="removeStudent()">Remove Last</button>
    <div id="output"></div>
    <script>
        let students = ["Ali", "Sara", "Ahmed"];
        const output = document.getElementById("output");
        function showStudents() {
            output.innerHTML = "";
            for (let i = 0; i < students.length; i++) {
                output.innerHTML += `<div class="box">${students[i]}</div>`;
            }
        }
        function addStudent() {
            students.push("Ayesha");
            showStudents();
        }
        function removeStudent() {
            students.pop();
            showStudents();
        }
    </script>
</body>

</html>
