<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Dashboard</title>

<!-- Bootstrap -->

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Bootstrap Icons -->

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

<!-- Chart JS -->

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
background:#f5f5f5;
}

.sidebar{
height:100vh;
background:#212529;
}

.sidebar a{
color:white;
display:block;
padding:12px;
text-decoration:none;
}

.sidebar a:hover{
background:#495057;
}

.profile{
color:white;
text-align:center;
padding:20px;
}

</style>

</head>

<body>

<!-- Navbar -->

<nav class="navbar navbar-dark bg-dark">
<div class="container-fluid">

<span class="navbar-brand" style="color: aquamarine;">Admin Dashboard</span>

<div class="text-white">
<i class="bi bi-bell"></i>
<i class="bi bi-person-circle"></i>
</div>

</div>
</nav>

<div class="container-fluid">

<div class="row">

<!-- Sidebar -->

<div class="col-md-2 sidebar">

<div class="profile">
<i class="bi bi-person-circle fs-1"></i>
<h5>Saba</h5>
</div>

<a href="#"><i class="bi bi-speedometer2"></i> Dashboard</a>
<a href="#"><i class="bi bi-box"></i> Products</a>
<a href="#"><i class="bi bi-cart"></i> Orders</a>
<a href="#"><i class="bi bi-people"></i> Customers</a>
<a href="#"><i class="bi bi-gear"></i> Settings</a>

</div>

<!-- Main Content -->

<div class="col-md-10 p-4">

<h3>Dashboard Overview</h3>

<!-- Cards -->

<div class="row mt-4">

<div class="col-md-4">
<div class="card p-3">
<h5>Total Sales</h5>
<h3>$5000</h3>
</div>
</div>

<div class="col-md-4">
<div class="card p-3">
<h5>Orders</h5>
<h3>120</h3>
</div>
</div>

<div class="col-md-4">
<div class="card p-3">
<h5>Customers</h5>
<h3>80</h3>
</div>
</div>

</div>

<!-- Chart -->

<div class="card mt-5 p-4">

<h4>Sales Chart</h4>

<canvas id="myChart"></canvas>

</div>

</div>

</div>

</div>

<script>

var ctx = document.getElementById('myChart');

new Chart(ctx, {

type: 'bar',

data: {

labels: ['Jan','Feb','Mar','Apr','May'],

datasets: [{
label: 'Sales',
data: [120,190,300,250,400],
borderWidth:1
}]

}

});

</script>

</body>
</html>

</body>
</html>
